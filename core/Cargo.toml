[workspace]
resolver = "2"
members = [
    "crypto",
    "vault",
    "generator",
    "search",
    "backup",
    "import_export",
    "sync",
    "security",
    "ffi",
    "native_host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering <security@antigravity.internal>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/daya/rustpwdvault"

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
aes-gcm = { version = "0.10", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
subtle = "2.6"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
prost = "0.13"
proptest = "1.5"
