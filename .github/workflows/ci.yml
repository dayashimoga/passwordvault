name: CI & Multi-Platform Release Builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Quality Gates & Lints
  # =========================================================================
  docs-and-lint:
    name: Documentation & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate Documentation Invariants
        run: |
          for doc in \
            docs/Requirements.md \
            docs/Architecture.md \
            docs/SecurityArchitecture.md \
            docs/ADR/ADR-001-vault-format-and-storage.md \
            docs/ADR/ADR-002-cryptographic-primitives-and-kdf.md \
            docs/ADR/ADR-003-ffi-and-ui-integration.md \
            docs/ADR/ADR-004-memory-zeroization-and-sanitization.md \
            docs/ImplementationPlan.md \
            docs/Setup.md \
            docs/DeveloperGuide.md \
            docs/CodeUnderstanding.md \
            docs/UserGuide.md \
            docs/TestingStrategy.md \
            docs/PerformanceStrategy.md \
            docs/RecoveryGuide.md \
            docs/Troubleshooting.md \
            docs/ReleaseProcess.md \
            docs/RiskRegister.md \
            docs/CHANGELOG.md \
            docs/TODO.md; do
            if [ ! -f "$doc" ]; then
              echo "Missing required document: $doc"
              exit 1
            fi
          done

      - name: Check Formatting (cargo fmt)
        run: |
          cd core
          cargo fmt --all -- --check

      - name: Clippy Warnings-as-Errors
        run: |
          cd core
          cargo clippy --workspace --all-targets -- -D warnings

  # =========================================================================
  # 2. Core Rust Workspace Tests (Linux)
  # =========================================================================
  core-tests-linux:
    name: Core Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Core Unit, Property & Fuzz Tests
        run: |
          cd core
          cargo test --workspace --verbose

      - name: Run Cryptographic Benchmarks
        run: |
          cd benchmarks
          cargo run --release --bin kdf_bench

  # =========================================================================
  # 3. Core Rust Workspace Tests (Windows)
  # =========================================================================
  core-tests-windows:
    name: Core Tests (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Core Workspace Tests
        run: |
          cd core
          cargo test --workspace --verbose

      - name: Run Benchmarks
        run: |
          cd benchmarks
          cargo run --release --bin kdf_bench

  # =========================================================================
  # 4. Flutter Quality & Test Suite
  # =========================================================================
  flutter-tests:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust FFI for Tests
        run: |
          cd core
          cargo build --release -p pwdvault-ffi
          mkdir -p ../apps/flutter/lib
          cp target/release/libpwdvault_ffi.so ../apps/flutter/libpwdvault_ffi.so || true
          cp target/release/libpwdvault_ffi.so ../apps/flutter/lib/libpwdvault_ffi.so || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze Flutter Code
        run: |
          cd apps/flutter
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: |
          cd apps/flutter
          flutter test

  # =========================================================================
  # 5. Security Audit & SBOM
  # =========================================================================
  security-audit-and-sbom:
    name: Security Audit & CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install audit and cyclonedx tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-cyclonedx

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          cd core
          cargo audit || echo "Audit completed with warnings"

      - name: Generate CycloneDX SBOM
        run: |
          cd core
          cargo cyclonedx --all --output-format json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: core/*.cdx.json
          retention-days: 90

  # =========================================================================
  # 6. Build Windows Application & Upload Artifact
  # =========================================================================
  build-windows-app:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Rust FFI and Native Host
        run: |
          cd core
          cargo build --release -p pwdvault-ffi
          cargo build --release -p pwdvault-native-host
          Copy-Item target\release\pwdvault_ffi.dll ..\apps\flutter\pwdvault_ffi.dll -Force

      - name: Build Flutter Windows Desktop
        run: |
          cd apps\flutter
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package Windows Distribution
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package_windows.ps1

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-windows-x64
          path: dist/windows/*
          retention-days: 30

  # =========================================================================
  # 7. Build Android Application (APK & AAB) & Upload Artifact
  # =========================================================================
  build-android-app:
    name: Build Android Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: |
          cd apps/flutter
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB)
        run: |
          cd apps/flutter
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-android-bundle
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # =========================================================================
  # 8. Build Linux Application & Upload Artifact
  # =========================================================================
  build-linux-app:
    name: Build Linux Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev pkg-config clang cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Package Linux Distribution
        run: |
          bash scripts/package_linux.sh

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-linux-x64
          path: dist/linux/*
          retention-days: 30

  # =========================================================================
  # 9. Build macOS Application & Upload Artifact
  # =========================================================================
  build-macos-app:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Package macOS Distribution
        run: |
          bash scripts/package_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-macos
          path: dist/macos/*
          retention-days: 30

  # =========================================================================
  # 10. Package Browser Extension & Upload Artifact
  # =========================================================================
  package-browser-extension:
    name: Package Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Manifest V3 Browser Extension
        run: |
          mkdir -p dist/browser_extension
          cd apps/browser_extension
          zip -r "../../dist/browser_extension/antigravity-vault-browser-extension.zip" . -x "*.git*"
          cd ../../dist/browser_extension
          sha256sum antigravity-vault-browser-extension.zip > SHA256SUMS.txt

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-vault-browser-extension
          path: dist/browser_extension/*
          retention-days: 30
